<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>Contact | A Little Hello</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #dacfd6; color: #40089b; font-family: Georgia, 'Times New Roman', serif; }
    nav { position: absolute; top: 1.5rem; right: 2rem; display: flex; gap: 1.25rem; font: 600 .8rem Arial, sans-serif; }
    nav a { color: #40089b; text-decoration: none; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; }
    main { width: min(100% - 2rem, 680px); padding: 3rem 2rem; text-align: center; }
    .eyebrow { margin: 0 0 .8rem; color: #786a75; font: 700 .72rem/1.4 Arial, sans-serif; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 400; letter-spacing: -.045em; }
    h1 span { color: #12a85a; font-style: italic; }
    .copy { max-width: 540px; margin: 1.5rem auto 0; color: #514652; font: 1.1rem/1.75 Arial, sans-serif; }
    .email { display: inline-block; margin-top: 1.5rem; padding: .9rem 1.2rem; border: 1px solid #40089b; border-radius: 999px; color: #40089b; font: 600 .95rem Arial, sans-serif; text-decoration: none; }
    .email:hover, .email:focus-visible { background: #40089b; color: white; }
    .links { display: flex; justify-content: center; gap: 1.5rem; margin-top: 2rem; font: 600 .9rem Arial, sans-serif; }
    .links a { color: #e60606; }
    @media (max-width: 480px) { nav { right: 1rem; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <p class="eyebrow">Say hello</p>
    <h1>We’d love to <span>hear</span> from you.</h1>
    <p class="copy">Have a question, an idea, or just want to share a little hello? Send us a note and we’ll be happy to hear from you.</p>
    <a class="email" href="mailto:hello@example.com">Email hello@example.com</a>
    <div class="links"><a href="about.html">About us</a><a href="index.html">Back home</a></div>
  </main>
</body>
</html>
